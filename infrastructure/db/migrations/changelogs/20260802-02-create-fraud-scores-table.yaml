# Creates the fraud_scores table.
#
# Phase 1 only produces isolation_forest_score (Isolation Forest is the only
# model trained in this phase); autoencoder_score is nullable and filled in
# once the autoencoder model ships in Phase 2. explanation (SHAP values) is
# nullable and populated starting Phase 3 when explainability is added.
databaseChangeLog:
  - changeSet:
      id: 20260802-02-01
      author: lynceus
      comment: Create fraud_scores table
      changes:
        - createTable:
            tableName: fraud_scores
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false
                    references: transactions(id)
                    foreignKeyName: fk_fraud_scores_transaction
              - column:
                  # Phase 1 only has this model.
                  name: isolation_forest_score
                  type: DECIMAL(5, 4)
              - column:
                  # NULLABLE — filled in Phase 2 once the autoencoder model ships.
                  name: autoencoder_score
                  type: DECIMAL(5, 4)
              - column:
                  name: ensemble_score
                  type: DECIMAL(5, 4)
                  constraints:
                    nullable: false
              - column:
                  # 'low', 'medium', 'high', 'critical'
                  name: risk_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: model_version
                  type: VARCHAR(50)
              - column:
                  name: feature_vector
                  type: JSONB
              - column:
                  # NULLABLE — SHAP values, added in Phase 3.
                  name: explanation
                  type: JSONB
              - column:
                  name: scored_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
