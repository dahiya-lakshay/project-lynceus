# Pins the Docker Engine API version docker-java (Testcontainers' Docker client) negotiates.
#
# Local dev machine runs Docker Desktop 29.x, whose daemon enforces MinAPIVersion 1.40 — newer
# than what docker-java 3.x (pulled in by testcontainers 1.20.4, see services/gradle/libs.versions.toml)
# auto-negotiates by default, which the daemon then rejects with a 400 Bad Request before any
# container ever starts (surfaces as Testcontainers' "Could not find a valid Docker environment").
# Pinning a version inside the daemon's supported range ([1.40, 1.55] on this machine) fixes it.
# See: https://github.com/testcontainers/testcontainers-java/issues/11422
api.version=1.44
