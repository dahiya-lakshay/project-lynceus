server:
  port: 8083

spring:
  application:
    name: dashboard-bff
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}

lynceus:
  transaction-service:
    url: ${TXN_SERVICE_URL:http://localhost:8081}
  tenant:
    default-tenant-id: default

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
