# OpenAPI 3.1 contract for the Customer Profile Service (Java / Spring Boot).
# This spec is the source of truth for services/customer-service - written
# before any implementation code exists, per AGENTS.md's API-First Design
# principle. Do not change endpoint shapes here to match an implementation;
# the implementation must conform to this contract.
#
# Customer Service is new in Phase 2, so - same as alert-api.yaml - every
# endpoint declares real Bearer JWT security from the start rather than
# inheriting Phase 1's stub.
#
# Whether GET /api/v1/customers/{id}/transactions is served by calling
# Transaction Service's API at request time or by reading a denormalized
# projection owned by this service is an implementation decision left to
# Task 9 (Customer Profile Service); this contract only fixes the response
# shape (paginated TransactionSummary, the same lightweight projection
# dashboard-bff-api.yaml already reuses), not how it's sourced.
openapi: 3.1.0
info:
  title: Lynceus Customer Profile Service API
  version: 0.1.0
  description: >-
    Serves customer risk profiles and per-customer transaction history for
    the fraud analyst dashboard. Every request is scoped to a single tenant
    via the X-Tenant-Id header.
servers:
  - url: http://localhost:8085
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Customers
    description: Query customer risk profiles and transaction history.

paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Paginated, searchable list of customers for the tenant.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          description: Free-text search over name, email, and external_id.
          schema:
            type: string
        - name: risk_level
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        '200':
          description: Paginated list of customers matching the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Retrieve a single customer's risk profile.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested customer risk profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{id}/transactions:
    get:
      tags: [Customers]
      operationId: getCustomerTransactions
      summary: Paginated transaction history timeline for a single customer.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated transaction history for the customer, most recent first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerTransactionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT issued by Keycloak. NGINX validates the token at the gateway
        before forwarding the request; services trust the tenant_id and
        role claims already present on the token.

  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: Identifier of the tenant making the request.
      schema:
        type: string

  schemas:
    TransactionSummary:
      $ref: './shared/schemas/transaction.yaml#/TransactionSummary'
    ErrorResponse:
      $ref: './shared/errors.yaml#/ErrorResponse'

    CustomerProfile:
      type: object
      description: >-
        A customer's risk profile as maintained by Customer Profile Service,
        aggregating fraud-relevant signals derived from their transaction and
        alert history.
      required:
        - id
        - tenant_id
        - external_id
        - risk_score
        - risk_level
        - total_transactions
        - total_fraud_alerts
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique customer identifier.
        tenant_id:
          type: string
          description: Identifier of the owning tenant (financial institution).
        external_id:
          type: string
          description: Customer identifier in the tenant's own system of record.
        name:
          type:
            - string
            - 'null'
          description: Customer display name. Null when not provided by the tenant's source system.
        email:
          type:
            - string
            - 'null'
          format: email
        phone:
          type:
            - string
            - 'null'
        risk_score:
          type: number
          minimum: 0
          maximum: 1
          description: Aggregate risk score derived from the customer's scored transaction and alert history. Defaults to 0 for a new customer with no scoring history yet.
        risk_level:
          type: string
          description: Risk tier derived from risk_score.
          enum:
            - low
            - medium
            - high
            - critical
        avg_transaction_amount:
          type:
            - number
            - 'null'
          format: decimal
          minimum: 0
          description: Mean transaction amount across the customer's history. Null until the customer has at least one transaction.
        total_transactions:
          type: integer
          minimum: 0
          description: Total number of transactions recorded for this customer.
        total_fraud_alerts:
          type: integer
          minimum: 0
          description: Total number of alerts ever raised against this customer's transactions.
        home_location_lat:
          type:
            - number
            - 'null'
          format: double
          description: Latitude of the customer's registered home location, used as a feature for foreign/anomalous-location detection. Null when unknown.
        home_location_lng:
          type:
            - number
            - 'null'
          format: double
          description: Longitude of the customer's registered home location. Null when unknown.
        profile_metadata:
          type: object
          description: >-
            Free-form passthrough attributes, persisted as JSONB. MUST NOT
            contain PII beyond what's already modeled explicitly above, or
            full card/account numbers - masking and validation of sensitive
            values is enforced at the service layer per AGENTS.md's Security
            section, not by this schema.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: Timestamp the customer profile record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp the customer profile record was last updated.

    CustomerListResponse:
      type: object
      description: Paginated list of customer risk profiles.
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerProfile'
        total:
          type: integer
          minimum: 0
          description: Total number of customers matching the query, across all pages.
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed).
        page_size:
          type: integer
          minimum: 1
          description: Number of items per page.

    CustomerTransactionsResponse:
      type: object
      description: Paginated transaction history timeline for a single customer, most recent first.
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummary'
        total:
          type: integer
          minimum: 0
          description: Total number of transactions for this customer matching the query, across all pages.
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed).
        page_size:
          type: integer
          minimum: 1
          description: Number of items per page.

  responses:
    BadRequest:
      $ref: './shared/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './shared/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './shared/errors.yaml#/Forbidden'
    NotFound:
      $ref: './shared/errors.yaml#/NotFound'
    InternalServerError:
      $ref: './shared/errors.yaml#/InternalServerError'
