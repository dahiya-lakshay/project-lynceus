[project]
name = "lynceus-training-pipeline"
version = "0.1.0"
description = "Synthetic transaction data generator and Isolation Forest training pipeline for Lynceus fraud detection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pyyaml>=6.0.0",
    "psycopg[binary]>=3.2.0",
    # Path dependency onto the already-merged inference service so this
    # pipeline imports its FEATURE_COLUMNS / extract_features /
    # IsolationForestModel verbatim instead of re-deriving the same logic
    # here — see feature_engineer.py's module docstring and README.md for
    # why train/serve drift is the failure mode this avoids.
    "lynceus-inference-service",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv.sources]
# Editable local path, not a version pin — this is a sibling package in the
# same monorepo, not a published artifact. Editable so a `uv pip install -e`
# here always reflects the current checkout of inference-service, not a
# stale snapshot.
lynceus-inference-service = { path = "../inference-service", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This package has no importable library of its own (scripts/*.py are run
# directly, e.g. `python scripts/generate_synthetic_data.py`) — "scripts" is
# declared as the wheel's package purely so `uv pip install -e ".[dev]"`
# has something to build or point an editable install at.
packages = ["scripts"]
