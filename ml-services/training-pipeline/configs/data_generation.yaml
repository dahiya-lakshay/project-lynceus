# Parameters for scripts/generate_synthetic_data.py.
#
# `merchants.categories` MUST exactly match the `MerchantCategory` enum wire
# values in services/shared-lib's MerchantCategory.java and the inference
# service's ordinal encoding table in feature_engineer.py — the synthetic
# data is only useful for training if its categories are the same closed set
# the API and the feature engineering pipeline already agree on.
#
# `fraud_patterns.*.weight` values must sum to 1.0 — they're the proportion
# of the total fraud budget (num_transactions * fraud_rate) allocated to
# each pattern.

generation:
  num_customers: 200
  num_transactions: 100000
  fraud_rate: 0.02
  date_range:
    start: "2026-01-01"
    end: "2026-08-01"
  seed: 42

merchants:
  categories:
    - grocery
    - electronics
    - gas_station
    - restaurant
    - online_shopping
    - travel
    - entertainment
    - healthcare
    - utilities
    - clothing

fraud_patterns:
  high_amount:
    multiplier_range: [5, 10]
    weight: 0.3
  velocity_burst:
    min_transactions: 5
    window_hours: 1
    weight: 0.2
  geographic_impossibility:
    min_distance_km: 1000
    max_time_hours: 1
    weight: 0.2
  category_anomaly:
    weight: 0.15
  late_night:
    hour_range: [2, 5]
    weight: 0.15
